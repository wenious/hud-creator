<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1Click HUD Studio - Visual Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { display: flex; height: 100vh; background: #0f1117; color: #e1e7ec; overflow: hidden; }
    
    #sidebar { width: 340px; background: #161922; padding: 20px; border-right: 1px solid #232734; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; z-index: 100; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
    h2 { font-size: 1.1rem; color: #10b981; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.65rem; background: #10b98122; color: #10b981; padding: 2px 6px; border-radius: 4px; border: 1px solid #10b98155; }
    
    .section-title { font-size: 0.75rem; text-transform: uppercase; color: #64748b; font-weight: 700; margin-top: 6px; letter-spacing: 0.5px; }
    label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 4px; }
    input[type="text"], input[type="file"], select, textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #2a2f42; background: #0f1117; color: #f8fafc; font-size: 0.85rem; outline: none; }
    input[type="text"]:focus, select:focus { border-color: #10b981; background: #1a1e2b; }
    
    .color-row { display: flex; gap: 10px; align-items: center; }
    input[type="color"] { width: 55px; height: 38px; border-radius: 6px; border: 1px solid #2a2f42; background: #0f1117; cursor: pointer; padding: 2px; }

    .btn-group { display: flex; gap: 8px; }
    button { flex: 1; background: #10b981; color: #fff; border: none; font-weight: 600; font-size: 0.85rem; padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.15s; }
    button:hover { background: #059669; }
    .btn-dark { background: #232734; color: #cbd5e1; }
    .btn-dark:hover { background: #2e3446; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    textarea { height: 90px; color: #10b981; font-family: monospace; font-size: 0.75rem; resize: none; }

    #workspace { flex: 1; display: flex; flex-direction: column; background: #090a0f; }
    #toolbar { height: 48px; background: #161922; border-bottom: 1px solid #232734; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 0.8rem; color: #94a3b8; }
    #canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: auto; background-image: radial-gradient(#232734 1px, transparent 1px); background-size: 20px 20px; }
    canvas { background: #12151e; border: 1px solid #2a2f42; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: crosshair; }

    .shortcuts-box { font-size: 0.7rem; color: #64748b; line-height: 1.5; background: #0f1117; padding: 10px; border-radius: 6px; border: 1px solid #1e2230; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>1Click Studio <span class="badge">PRO</span></h2>

    <div class="section-title">HUD Background</div>
    <div>
      <label>Upload HUD Layout / Template</label>
      <input type="file" id="bg-upload" accept="image/*">
    </div>

    <div class="section-title">Selected Button Properties</div>
    <div>
      <label>Button ID (SL Prim Name)</label>
      <input type="text" id="btn-id" placeholder="Select a button on canvas">
    </div>

    <div>
      <label>Action Type</label>
      <select id="action-type">
        <option value="COL">Color (RGB Tint)</option>
        <option value="TEX">Texture (UUID / Image)</option>
        <option value="ALP">Alpha (Opacity)</option>
      </select>
    </div>

    <div id="color-section">
      <label>Button Color</label>
      <div class="color-row">
        <input type="color" id="color-picker" value="#3b82f6">
        <span id="hex-label" style="font-size: 0.8rem; color: #94a3b8;">#3b82f6</span>
      </div>
    </div>

    <div id="texture-preview-section">
      <label>Button Texture / Icon Image (Optional)</label>
      <input type="file" id="btn-img-upload" accept="image/*">
    </div>

    <div>
      <label>Target Face</label>
      <input type="text" id="target-face" value="ALL" placeholder="ALL or 0,1,2...">
    </div>

    <div>
      <label>Payload (UUID / Color Vector)</label>
      <input type="text" id="action-data" value="<0.231, 0.510, 0.965>">
    </div>

    <div class="btn-group">
      <button id="delete-btn" class="btn-danger">Delete</button>
      <button id="clear-btn" class="btn-dark">Reset All</button>
    </div>

    <div class="section-title">Compiler</div>
    <button id="export-btn">⚡ Generate SL Config</button>
    <textarea id="output-box" readonly placeholder="Output string will appear here..."></textarea>

    <div class="shortcuts-box">
      <b>Controls:</b><br>
      • <b>Click Button</b>: Edit details on sidebar<br>
      • <b>Drag Empty</b>: Draw new button<br>
      • <b>Drag Button</b>: Move position<br>
      • <b>Ctrl + D</b>: Duplicate | <b>Ctrl + Z</b>: Undo
    </div>
  </div>

  <div id="workspace">
    <div id="toolbar">
      <span>Workspace: <b>800 x 500 px</b></span>
      <span id="status-text" style="color: #10b981; font-weight: 600;">Ready</span>
    </div>
    <div id="canvas-container">
      <canvas id="hud-canvas" width="800" height="500"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hud-canvas');
    const ctx = canvas.getContext('2d');
    
    let buttons = [];
    let history = [];
    let bgImage = null;
    let selectedIndex = -1;
    let isDrawing = false;
    let isDragging = false;
    let dragOffsetX = 0, dragOffsetY = 0;
    let startX = 0, startY = 0;

    const btnIdInput = document.getElementById('btn-id');
    const actionType = document.getElementById('action-type');
    const targetFace = document.getElementById('target-face');
    const actionData = document.getElementById('action-data');
    const colorPicker = document.getElementById('color-picker');
    const hexLabel = document.getElementById('hex-label');
    const statusText = document.getElementById('status-text');

    function hexToVector(hex) {
      const r = (parseInt(hex.substr(1,2), 16) / 255).toFixed(3);
      const g = (parseInt(hex.substr(3,2), 16) / 255).toFixed(3);
      const b = (parseInt(hex.substr(5,2), 16) / 255).toFixed(3);
      return `<${r}, ${g}, ${b}>`;
    }

    function vectorToHex(vecStr) {
      const match = vecStr.match(/<([\d.]+),\s*([\d.]+),\s*([\d.]+)\>/);
      if (!match) return '#3b82f6';
      const r = Math.round(parseFloat(match[1]) * 255).toString(16).padStart(2, '0');
      const g = Math.round(parseFloat(match[2]) * 255).toString(16).padStart(2, '0');
      const b = Math.round(parseFloat(match[3]) * 255).toString(16).padStart(2, '0');
      return `#${r}${g}${b}`;
    }

    function updateInspector(index) {
      if (index >= 0 && index < buttons.length) {
        const b = buttons[index];
        btnIdInput.value = b.id;
        actionType.value = b.action;
        targetFace.value = b.face;
        actionData.value = b.data;
        colorPicker.value = b.colorHex || '#3b82f6';
        hexLabel.innerText = colorPicker.value;
        statusText.innerText = `Active: ${b.id}`;
      } else {
        btnIdInput.value = '';
        statusText.innerText = 'No button selected';
      }
    }

    btnIdInput.addEventListener('input', (e) => {
      if (selectedIndex !== -1 && buttons[selectedIndex]) {
        buttons[selectedIndex].id = e.target.value;
        statusText.innerText = `Active: ${e.target.value}`;
        render();
      }
    });

    colorPicker.addEventListener('input', () => {
      hexLabel.innerText = colorPicker.value;
      if (selectedIndex !== -1 && buttons[selectedIndex]) {
        buttons[selectedIndex].colorHex = colorPicker.value;
        if (buttons[selectedIndex].action === 'COL') {
          buttons[selectedIndex].data = hexToVector(colorPicker.value);
          actionData.value = buttons[selectedIndex].data;
        }
        render();
      }
    });

    actionType.addEventListener('change', () => {
      if (selectedIndex !== -1 && buttons[selectedIndex]) {
        buttons[selectedIndex].action = actionType.value;
        if (actionType.value === 'COL') {
          buttons[selectedIndex].data = hexToVector(colorPicker.value);
          actionData.value = buttons[selectedIndex].data;
        }
        render();
      }
    });

    targetFace.addEventListener('input', (e) => {
      if (selectedIndex !== -1 && buttons[selectedIndex]) {
        buttons[selectedIndex].face = e.target.value || 'ALL';
      }
    });

    actionData.addEventListener('input', (e) => {
      if (selectedIndex !== -1 && buttons[selectedIndex]) {
        buttons[selectedIndex].data = e.target.value;
        if (buttons[selectedIndex].action === 'COL') {
          const hex = vectorToHex(e.target.value);
          buttons[selectedIndex].colorHex = hex;
          colorPicker.value = hex;
          hexLabel.innerText = hex;
        }
        render();
      }
    });

    // Ana Arkaplan Resmi
    document.getElementById('bg-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          bgImage = new Image();
          bgImage.onload = () => render();
          bgImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Butona Ozel Resim/Ikon Yukleme
    document.getElementById('btn-img-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file && selectedIndex !== -1) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            buttons[selectedIndex].img = img;
            render();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function saveState() {
      history.push(JSON.stringify(buttons.map(b => ({ ...b, img: null }))));
      if (history.length > 30) history.shift();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      }

      buttons.forEach((btn, index) => {
        const isSelected = index === selectedIndex;
        const hex = btn.colorHex || '#3b82f6';
        
        ctx.save();
        
        if (btn.img) {
          ctx.drawImage(btn.img, btn.x, btn.y, btn.w, btn.h);
        } else {
          ctx.fillStyle = hex;
          ctx.globalAlpha = isSelected ? 0.85 : 0.45;
          ctx.fillRect(btn.x, btn.y, btn.w, btn.h);
        }

        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = isSelected ? '#10b981' : (btn.img ? '#ffffff' : hex);
        ctx.lineWidth = isSelected ? 3 : 1.5;
        ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(btn.id, btn.x + 6, btn.y + 16);
        ctx.restore();
      });
    }

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener('mousedown', (e) => {
      const pos = getMousePos(e);
      let clicked = -1;

      for (let i = buttons.length - 1; i >= 0; i--) {
        const b = buttons[i];
        if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
          clicked = i;
          break;
        }
      }

      if (clicked !== -1) {
        selectedIndex = clicked;
        isDragging = true;
        dragOffsetX = pos.x - buttons[clicked].x;
        dragOffsetY = pos.y - buttons[clicked].y;
        updateInspector(selectedIndex);
        render();
        return;
      }

      selectedIndex = -1;
      updateInspector(-1);
      startX = pos.x;
      startY = pos.y;
      isDrawing = true;
      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      const pos = getMousePos(e);
      if (isDragging && selectedIndex !== -1) {
        buttons[selectedIndex].x = pos.x - dragOffsetX;
        buttons[selectedIndex].y = pos.y - dragOffsetY;
        render();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (isDragging) {
        isDragging = false;
        saveState();
      }
      if (isDrawing) {
        isDrawing = false;
        const pos = getMousePos(e);
        const w = pos.x - startX;
        const h = pos.y - startY;

        if (Math.abs(w) > 15 && Math.abs(h) > 15) {
          saveState();
          const currentHex = colorPicker.value;
          const currentVec = hexToVector(currentHex);
          const newBtn = {
            id: `btn_${buttons.length + 1}`,
            x: Math.min(startX, pos.x),
            y: Math.min(startY, pos.y),
            w: Math.abs(w),
            h: Math.abs(h),
            action: actionType.value,
            face: targetFace.value || 'ALL',
            colorHex: currentHex,
            img: null,
            data: actionType.value === 'COL' ? currentVec : actionData.value
          };
          buttons.push(newBtn);
          selectedIndex = buttons.length - 1;
          updateInspector(selectedIndex);
          render();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      const isCtrl = e.ctrlKey || e.metaKey;

      if (isCtrl && e.key.toLowerCase() === 'z') {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
        e.preventDefault();
        if (history.length > 0) {
          buttons = JSON.parse(history.pop());
          selectedIndex = -1;
          updateInspector(-1);
          render();
        }
      }

      if (isCtrl && e.key.toLowerCase() === 'd') {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
        e.preventDefault();
        if (selectedIndex !== -1 && buttons[selectedIndex]) {
          saveState();
          const target = buttons[selectedIndex];
          buttons.push({ 
            ...target, 
            id: `${target.id}_copy`, 
            x: target.x + 20, 
            y: target.y + 20 
          });
          selectedIndex = buttons.length - 1;
          updateInspector(selectedIndex);
          render();
        }
      }

      if (e.key === 'Delete' || e.key === 'Backspace') {
        if (selectedIndex !== -1 && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          saveState();
          buttons.splice(selectedIndex, 1);
          selectedIndex = -1;
          updateInspector(-1);
          render();
        }
      }
    });

    document.getElementById('delete-btn').addEventListener('click', () => {
      if (selectedIndex !== -1) {
        saveState();
        buttons.splice(selectedIndex, 1);
        selectedIndex = -1;
        updateInspector(-1);
        render();
      }
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      saveState();
      buttons = [];
      selectedIndex = -1;
      updateInspector(-1);
      render();
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      let outputLines = [];
      buttons.forEach(btn => {
        outputLines.push(`${btn.id}=${btn.action}|${btn.face}|${btn.data}`);
      });
      document.getElementById('output-box').value = outputLines.join('\n');
    });

    render();
  </script>
</body>
</html>
